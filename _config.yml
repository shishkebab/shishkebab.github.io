# Site settings
title: Sukwha Kyung # site title
description: >- # site description
  Sukwha's Blog
lang: en-US # default lang
timezone: US/Arizona # set your timezone
image: # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/shishkebab # site repo [optional]
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: Sukwha Kyung # author name
  bio: >- # tell to the world
    Hi, I'm Sukwha.
  username: shishkebab # general username
  github: shishkebab # github username
  linkedin: sukwha # linkedin username
  twitter: sukwha_kyung # twitter username
  facebook:  # facebook username
  email: sukwha.kyung@asu.edu # email adress
  avatar: /assets/img/me.jpg # change with your own avatar

# URL settings
url: "https://shishkebab.github.io" #
baseurl:
permalink: /:title/
google_analytics: G-GZBE0MMZYC
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
